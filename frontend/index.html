<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'>
<title>Game Boy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-touch-callout:none;touch-action:manipulation}
html{height:100%}
body{height:100%;display:flex;flex-direction:column;align-items:stretch;background:#0d0d1a;color:#ccc;font-family:monospace;overflow:hidden;user-select:none}
#bar{flex:0 0 auto;display:flex;gap:6px;padding:6px;background:#111120;justify-content:flex-start;align-items:center;width:100%;flex-wrap:wrap}
.tb{background:#1e1e38;color:#999;border:1px solid #3a3a5a;border-radius:4px;padding:5px 10px;cursor:pointer;font:12px/1 monospace;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tb:active{background:#3a3a6a}
select.tb{padding:4px 6px;-webkit-appearance:none;appearance:none;cursor:pointer}
#st{font-size:11px;color:#555;margin-left:auto;padding-right:4px}
#sw{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#111}
#ctrl-canvas{flex:0 0 auto;display:block;width:100%;height:160px;background:#0a0a18;touch-action:none}
#hint{flex:0 0 auto;font-size:11px;color:#555;text-align:center;padding:4px;width:100%}
@media(min-width:540px){#ctrl-canvas{display:none}#hint{display:block}}
@media(max-width:539px){#hint{display:none}}
/* ---- Settings drawer (normal flow, slides in below the bar) ---- */
#sdrawer{display:none;flex:0 0 auto;background:#111120;border-bottom:1px solid #3a3a5a;border-top:1px solid #2a2a3a;padding:8px 10px;flex-direction:column;gap:8px}
#sdrawer.open{display:flex}
.sdr-row{display:flex;align-items:center;gap:8px}
.sdr-row label{color:#888;font-size:12px;min-width:76px;flex-shrink:0}
.sdr-row select{flex:1}
.sdr-sep{border:none;border-top:1px solid #252538;margin:2px 0}
/* ---- Save slots modal (bottom sheet on mobile, centered on desktop) ---- */
#slots-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:flex-end;justify-content:center}
#slots-overlay.open{display:flex}
.slots-panel{background:#0d0d1a;border:1px solid #3a3a5a;border-radius:10px 10px 0 0;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.slots-hdr{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid #3a3a5a;font-size:13px;color:#ccc;position:sticky;top:0;background:#0d0d1a;z-index:1}
.slot-row{padding:11px 14px;border-bottom:1px solid #181828;cursor:pointer}
.slot-row:last-child{border-bottom:none}
.slot-row.active-slot{background:#141430}
.slot-top{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.slot-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid #444;flex-shrink:0}
.slot-row.active-slot .slot-dot{background:#7cb8ff;border-color:#7cb8ff}
.slot-num{font-size:11px;color:#555;flex-shrink:0}
.slot-sname{font-size:13px;color:#ccc}
.slot-empty{font-size:13px;color:#2e2e48;font-style:italic}
.slot-ts{font-size:11px;color:#555;margin-left:15px;margin-bottom:6px}
.slot-btns{display:flex;gap:6px;margin-left:15px}
.slot-btns .tb{flex:1;padding:6px 0;font-size:12px;text-align:center}
@media(min-height:500px) and (min-width:480px){#slots-overlay{align-items:center}.slots-panel{border-radius:8px;max-height:70vh}}
</style>
</head>
<body>
<div id='bar'>
  <button class='tb' id='bmenu' title='Settings'>☰</button>
  <button class='tb' id='bslots' style='display:none'>Slots</button>
  <button class='tb' id='brs'>Reset</button>
  <button class='tb' id='bft'>Fast</button>
  <button class='tb' id='brm' style='display:none'>Load ROM</button>
  <span id='st'>Connecting…</span>
</div>
<!-- Settings drawer (toggled by ☰) -->
<div id='sdrawer'>
  <div class='sdr-row'>
    <label>Palette</label>
    <select class='tb' id='bpal' title='Palette'></select>
  </div>
  <div class='sdr-row' id='transport-row'>
    <label>Transport</label>
    <select class='tb' id='btrans' title='Transport'>
      <option value='0'>Reliable</option>
      <option value='1'>Fast</option>
    </select>
  </div>
  <hr class='sdr-sep' id='wasm-sep' style='display:none'>
  <div class='sdr-row' id='wasm-saves' style='display:none'>
    <button class='tb' id='bsv' style='flex:1'>Save State</button>
    <button class='tb' id='bld' style='flex:1'>Load State</button>
  </div>
</div>
<!-- Save slots modal -->
<div id='slots-overlay'>
  <div class='slots-panel'>
    <div class='slots-hdr'>
      <span>💾 Save Slots</span>
      <button class='tb' id='slots-close'>✕</button>
    </div>
    <div id='slots-list'></div>
  </div>
</div>
<div id='sw'><canvas id='screen' width='160' height='144'></canvas></div>
<canvas id='ctrl-canvas'></canvas>
<div id='hint'>Arrows: D-Pad &nbsp; A: A &nbsp; S: B &nbsp; Enter: Start &nbsp; Shift: Select &nbsp; F5: Quick Save &nbsp; F8: Quick Load &nbsp; F: Fast &nbsp; F6/⇧F6: Palette</div>
<script>
'use strict';

/* Palette table — must match GB_PALETTES[] in palette.c.
 * Each entry: { name, c: [r,g,b, r,g,b, r,g,b, r,g,b] } shade 0=lightest. */
const PALETTES = [
  { name: "DMG Gray",       c: [255,255,255,170,170,170,85,85,85,0,0,0] },
  { name: "DMG Inverted",   c: [0,0,0,85,85,85,170,170,170,255,255,255] },
  { name: "GB Green",       c: [155,188,15,139,172,15,48,98,48,15,56,15] },
  { name: "GB Pocket",      c: [196,207,161,139,149,109,77,83,60,31,31,31] },
  { name: "GB Light",       c: [224,248,224,136,208,136,56,104,56,8,16,8] },
  { name: "GBC Brown",      c: [248,232,200,176,144,96,104,56,32,24,8,8] },
  { name: "GBC Red",        c: [255,234,234,204,68,68,136,20,20,48,0,0] },
  { name: "GBC Dark Brown", c: [240,208,136,192,112,48,112,64,16,16,8,0] },
  { name: "GBC Pastel Mix", c: [248,248,232,200,168,88,104,80,40,24,16,0] },
  { name: "GBC Blue",       c: [224,248,248,88,136,208,24,56,160,0,8,24] },
  { name: "GBC Dark Blue",  c: [208,240,255,32,96,192,16,48,128,0,0,16] },
  { name: "GBC Green",      c: [224,248,208,112,192,64,48,112,24,8,24,8] },
  { name: "GBC Dark Green", c: [200,232,176,96,160,64,48,80,32,8,16,8] },
  { name: "GBC Yellow",     c: [248,248,168,232,200,32,160,120,8,40,32,0] },
  { name: "GBC Orange",     c: [248,224,168,240,144,32,160,72,8,32,16,0] },
  { name: "GBC Reverse",    c: [15,56,15,48,98,48,139,172,15,155,188,15] },
  { name: "Amber Terminal", c: [255,232,144,255,152,0,192,80,0,32,8,0] },
  { name: "Green Terminal", c: [170,255,170,0,238,0,0,119,0,0,20,0] },
  { name: "Ice Blue",       c: [232,244,255,144,200,240,32,96,184,0,20,40] },
  { name: "High Contrast",  c: [255,255,255,136,136,136,51,51,51,0,0,0] },
  { name: "Night Mode",     c: [143,168,192,64,88,104,24,40,56,4,8,16] },
  { name: "Nord",           c: [236,239,244,136,192,208,76,86,106,46,52,64] },
  { name: "Nord Dark",      c: [46,52,64,76,86,106,136,192,208,236,239,244] },
];

class RemoteBackend {
  constructor(url) {
    this.onframe = null;
    this.onstatus = null;
    this._url = url;
    this._ws = null;
    this._g_px = new Uint8ClampedArray(160 * 144 * 4);
    this._curr_2bpp = new Uint8Array(5760);      /* local framebuffer copy for tile-diff and re-palette */
    this._PALETTE = new Uint8Array([255,255,255,170,170,170,85,85,85,0,0,0]);
    this._transportMode = 0;   /* 0=RELIABLE, 1=FAST */
    this._connect();
  }
  /* Decode a full 5760-byte 2bpp buffer into _g_px using current palette. */
  _decode2bpp(src) {
    let bi = 0;
    for (let i = 0; i < 5760; i++) {
      const b = src[i];
      let x;
      x=((b>>6)&3)*3; this._g_px[bi++]=this._PALETTE[x];this._g_px[bi++]=this._PALETTE[x+1];this._g_px[bi++]=this._PALETTE[x+2];this._g_px[bi++]=255;
      x=((b>>4)&3)*3; this._g_px[bi++]=this._PALETTE[x];this._g_px[bi++]=this._PALETTE[x+1];this._g_px[bi++]=this._PALETTE[x+2];this._g_px[bi++]=255;
      x=((b>>2)&3)*3; this._g_px[bi++]=this._PALETTE[x];this._g_px[bi++]=this._PALETTE[x+1];this._g_px[bi++]=this._PALETTE[x+2];this._g_px[bi++]=255;
      x=(b&3)*3;      this._g_px[bi++]=this._PALETTE[x];this._g_px[bi++]=this._PALETTE[x+1];this._g_px[bi++]=this._PALETTE[x+2];this._g_px[bi++]=255;
    }
  }
  /* Patch a single 8x8 tile (tx,ty) from 16 bytes of 2bpp data into _curr_2bpp and _g_px. */
  _patchTile(tx, ty, data, doff) {
    for (let r = 0; r < 8; r++) {
      const src_off = (ty * 8 + r) * 40 + tx * 2;  /* offset in _curr_2bpp */
      const b0 = data[doff + r * 2];
      const b1 = data[doff + r * 2 + 1];
      this._curr_2bpp[src_off]     = b0;
      this._curr_2bpp[src_off + 1] = b1;
      /* Decode 8 pixels into _g_px */
      const px_base = ((ty * 8 + r) * 160 + tx * 8) * 4;
      for (let col = 0; col < 4; col++) {
        const idx0 = ((b0 >> (6 - col * 2)) & 3) * 3;
        let bi = px_base + col * 4;
        this._g_px[bi++]=this._PALETTE[idx0];this._g_px[bi++]=this._PALETTE[idx0+1];this._g_px[bi++]=this._PALETTE[idx0+2];this._g_px[bi]=255;
      }
      for (let col = 0; col < 4; col++) {
        const idx1 = ((b1 >> (6 - col * 2)) & 3) * 3;
        let bi = px_base + (4 + col) * 4;
        this._g_px[bi++]=this._PALETTE[idx1];this._g_px[bi++]=this._PALETTE[idx1+1];this._g_px[bi++]=this._PALETTE[idx1+2];this._g_px[bi]=255;
      }
    }
  }
  _connect() {
    this._ws = new WebSocket(this._url);
    this._ws.binaryType = 'arraybuffer';
    this._ws.onopen = () => {
      if (this.onstatus) this.onstatus('Connected');
      /* Notify server of the current transport mode immediately on (re)connect. */
      this._snd(0x07, this._transportMode);
    };
    this._ws.onclose = () => {
      if (this.onstatus) this.onstatus('Disconnected');
      setTimeout(() => this._connect(), 2000);
    };
    this._ws.onerror = () => {};
    this._ws.onmessage = (e) => {
      const d = new Uint8Array(e.data);
      if (d[0] === 0x01 && d.length === 5761) {
        /* Full framebuffer */
        this._curr_2bpp.set(d.subarray(1, 5761));
        this._decode2bpp(this._curr_2bpp);
        if (this.onframe) this.onframe(this._g_px);
      } else if (d[0] === 0x10 && d.length >= 3) {
        /* Tile update batch */
        const count = d[1] | (d[2] << 8);
        let pos = 3;
        for (let i = 0; i < count; i++) {
          const tx = d[pos++];
          const ty = d[pos++];
          this._patchTile(tx, ty, d, pos);
          pos += 16;
        }
        if (this.onframe) this.onframe(this._g_px);
      } else if (d[0] === 0x12) {
        /* Slot info update */
        try {
          const info = JSON.parse(new TextDecoder().decode(d.subarray(1)));
          if (this.onslotinfo) this.onslotinfo(info);
        } catch(_) {}
      }
    };
  }
  _snd(cmd, extra) {
    if (!this._ws || this._ws.readyState !== 1) return;
    const m = new Uint8Array(extra !== undefined ? 2 : 1);
    m[0] = cmd;
    if (extra !== undefined) m[1] = extra & 255;
    this._ws.send(m.buffer);
  }
  sendJoypad(mask) { this._snd(2, mask); }
  sendSave()       { this._snd(3); }
  sendLoad()       { this._snd(4); }
  sendReset()      { this._snd(5); }
  setFast(_on)     { this._snd(6); }
  setTransport(mode) {
    this._transportMode = mode & 1;
    this._snd(0x07, this._transportMode);
  }
  sendSaveSlot(slot, name) {
    if (!this._ws || this._ws.readyState !== 1) return;
    const nb = (name && name.length) ? new TextEncoder().encode(name.slice(0, 64)) : new Uint8Array(0);
    const msg = new Uint8Array(3 + nb.length);
    msg[0] = 0x08; msg[1] = slot & 0xff; msg[2] = nb.length;
    if (nb.length) msg.set(nb, 3);
    this._ws.send(msg.buffer);
  }
  sendLoadSlot(slot) { this._snd(0x09, slot); }
  setPalette(idx) {
    const pal = PALETTES[idx] || PALETTES[0];
    for (let i = 0; i < 4; i++) {
      this._PALETTE[i * 3]     = pal.c[i * 3];
      this._PALETTE[i * 3 + 1] = pal.c[i * 3 + 1];
      this._PALETTE[i * 3 + 2] = pal.c[i * 3 + 2];
    }
    /* Re-render current frame with new palette */
    this._decode2bpp(this._curr_2bpp);
    if (this.onframe) this.onframe(this._g_px);
  }
}

class WasmBackend {
  constructor(module) {
    this.onframe = null;
    this.onstatus = null;
    this._mod = module;
    this._g_px = new Uint8ClampedArray(160 * 144 * 4);
    this._running = false;
    this._fast = false;
    this._loopToken = 0;
  }
  loadRom(romData) {
    this._running = false;
    this._loopToken++;
    const mod = this._mod;
    const ptr = mod._malloc(romData.length);
    mod.HEAPU8.set(romData, ptr);
    mod._wasm_init(ptr, romData.length);
    mod._free(ptr);
    if (this.onstatus) this.onstatus('Running (WASM)');
    this._startLoop();
  }
  _startLoop() {
    this._running = true;
    const token = ++this._loopToken;
    const loop = () => {
      if (!this._running || token !== this._loopToken) return;
      const t0 = performance.now();
      this._mod._wasm_run_frame();
      this._renderFrame();
      const elapsed = performance.now() - t0;
      const target = this._fast ? 4.17 : 16.67;
      const delay = Math.max(0, target - elapsed);
      setTimeout(loop, delay);
    };
    loop();
  }
  _renderFrame() {
    const mod = this._mod;
    const pixPtr = mod._wasm_get_pixels_ptr();
    const src = mod.HEAPU8.subarray(pixPtr, pixPtr + 160 * 144 * 4);
    this._g_px.set(src);
    if (this.onframe) this.onframe(this._g_px);
  }
  sendJoypad(mask) {
    this._mod._wasm_set_buttons(mask);
  }
  sendSave() {
    const mod = this._mod;
    mod._wasm_save_state();
    const sz = mod._wasm_save_state_size();
    if (sz <= 0) return;
    const ptr = mod._malloc(sz);
    mod._wasm_get_save_state(ptr, sz);
    const data = mod.HEAPU8.slice(ptr, ptr + sz);
    mod._free(ptr);
    const blob = new Blob([data], {type: 'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'save.cbor';
    a.click();
    URL.revokeObjectURL(url);
  }
  sendLoad() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.cbor';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      file.arrayBuffer().then((buf) => {
        const data = new Uint8Array(buf);
        const mod = this._mod;
        const ptr = mod._malloc(data.length);
        mod.HEAPU8.set(data, ptr);
        mod._wasm_load_state(ptr, data.length);
        mod._free(ptr);
        if (this.onstatus) this.onstatus('State loaded');
      });
    };
    input.click();
  }
  sendReset() {
    this._mod._wasm_reset();
  }
  setFast(on) {
    this._fast = !!on;
    this._mod._wasm_set_fast(this._fast ? 1 : 0);
  }
  setPalette(idx) {
    this._mod._wasm_set_palette(idx);
  }
}

(function() {
  const cv = document.getElementById('screen');
  const ctx = cv.getContext('2d');
  const st = document.getElementById('st');
  const cc = document.getElementById('ctrl-canvas');
  const cc2 = cc.getContext('2d');
  const brom = document.getElementById('brm');
  const bpal = document.getElementById('bpal');
  const btrans = document.getElementById('btrans');
  const sdrawer = document.getElementById('sdrawer');
  const slotsOverlay = document.getElementById('slots-overlay');
  const frameImage = ctx.createImageData(160, 144);
  let backend = null;
  let isWasm = false;
  let btns = 0;
  let fast = false;
  let cBtns = 0;
  const cTouches = {};
  const CL = {};
  const km = {ArrowRight:0,ArrowLeft:1,ArrowUp:2,ArrowDown:3,a:4,A:4,s:5,S:5,Enter:7,Shift:6};

  /* ---- Slot state ---- */
  let activeSlot = parseInt(localStorage.getItem('gb_active_slot') || '1', 10);
  if (activeSlot < 1 || activeSlot > 5) activeSlot = 1;
  let slotData = [1,2,3,4,5].map(n => ({slot:n,exists:false,name:'',ts:0}));

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmtTs(ts) {
    if (!ts) return '';
    return new Date(ts * 1000).toLocaleString(undefined,
      {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
  }

  function renderSlots() {
    const list = document.getElementById('slots-list');
    list.innerHTML = '';
    slotData.forEach(sd => {
      const active = sd.slot === activeSlot;
      const div = document.createElement('div');
      div.className = 'slot-row' + (active ? ' active-slot' : '');
      const ts = fmtTs(sd.ts);
      div.innerHTML =
        '<div class="slot-top">' +
          '<div class="slot-dot"></div>' +
          '<span class="slot-num">Slot ' + sd.slot + '</span>' +
          (sd.exists
            ? '<span class="slot-sname">' + escHtml(sd.name || '') + '</span>'
            : '<span class="slot-empty">— empty —</span>') +
        '</div>' +
        (ts ? '<div class="slot-ts">' + escHtml(ts) + '</div>' : '') +
        '<div class="slot-btns">' +
          '<button class="tb slot-save-btn" data-slot="' + sd.slot + '">Save</button>' +
          '<button class="tb slot-load-btn" data-slot="' + sd.slot + '"' + (!sd.exists ? ' disabled' : '') + '>Load</button>' +
        '</div>';
      div.addEventListener('click', e => {
        if (e.target.matches('button')) return;
        activeSlot = sd.slot;
        localStorage.setItem('gb_active_slot', activeSlot);
        renderSlots();
      });
      list.appendChild(div);
    });
    list.querySelectorAll('.slot-save-btn').forEach(btn => {
      btn.onclick = e => { e.stopPropagation(); doSaveSlot(parseInt(btn.dataset.slot)); };
    });
    list.querySelectorAll('.slot-load-btn').forEach(btn => {
      btn.onclick = e => { e.stopPropagation(); doLoadSlot(parseInt(btn.dataset.slot)); };
    });
  }

  function doSaveSlot(slot) {
    const sd = slotData.find(s => s.slot === slot) || {};
    const msg = sd.exists
      ? 'Overwrite Slot ' + slot + (sd.name ? ': "' + sd.name + '"' : '') + '?\n\nNew name (leave blank to keep):'
      : 'Save to Slot ' + slot + ':\n\nName (optional):';
    const name = window.prompt(msg, sd.name || '');
    if (name === null) return;
    if (backend && backend.sendSaveSlot) backend.sendSaveSlot(slot, name.trim());
    activeSlot = slot;
    localStorage.setItem('gb_active_slot', activeSlot);
  }

  function doLoadSlot(slot) {
    const sd = slotData.find(s => s.slot === slot);
    if (!sd || !sd.exists) return;
    const label = sd.name ? '"' + sd.name + '"' : 'Slot ' + slot;
    if (!window.confirm('Load Slot ' + slot + ': ' + label + '?\n\nThis replaces the current game state.')) return;
    if (backend && backend.sendLoadSlot) backend.sendLoadSlot(slot);
    activeSlot = slot;
    localStorage.setItem('gb_active_slot', activeSlot);
    slotsOverlay.classList.remove('open');
  }

  /* ---- Settings drawer ---- */
  document.getElementById('bmenu').onclick = () => sdrawer.classList.toggle('open');
  /* Clicking on the game canvas closes the drawer */
  cv.addEventListener('mousedown', () => sdrawer.classList.remove('open'));
  cv.addEventListener('touchstart', () => sdrawer.classList.remove('open'), {passive:true});

  /* ---- Slots modal ---- */
  document.getElementById('bslots').onclick = () => {
    renderSlots();
    slotsOverlay.classList.add('open');
  };
  document.getElementById('slots-close').onclick = () => slotsOverlay.classList.remove('open');
  slotsOverlay.addEventListener('click', e => {
    if (e.target === slotsOverlay) slotsOverlay.classList.remove('open');
  });

  /* Populate palette dropdown */
  PALETTES.forEach((p, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = p.name;
    bpal.appendChild(opt);
  });
  let paletteIdx = parseInt(localStorage.getItem('gb_palette') || '0', 10);
  if (paletteIdx < 0 || paletteIdx >= PALETTES.length) paletteIdx = 0;
  bpal.value = paletteIdx;

  function applyPalette(idx) {
    paletteIdx = idx;
    localStorage.setItem('gb_palette', idx);
    bpal.value = idx;
    if (backend && backend.setPalette) backend.setPalette(idx);
  }

  bpal.onchange = () => applyPalette(parseInt(bpal.value, 10));

  /* Transport mode dropdown (RemoteBackend only; hidden for WasmBackend) */
  let transportMode = parseInt(localStorage.getItem('gb_transport') || '0', 10);
  if (transportMode !== 0 && transportMode !== 1) transportMode = 0;
  btrans.value = transportMode;

  function applyTransport(mode) {
    transportMode = mode;
    localStorage.setItem('gb_transport', mode);
    btrans.value = mode;
    if (backend && backend.setTransport) backend.setTransport(mode);
  }

  btrans.onchange = () => applyTransport(parseInt(btrans.value, 10));

  function updateStatus(text) {
    st.textContent = text;
  }

  function renderFrame(pixels) {
    frameImage.data.set(pixels);
    ctx.putImageData(frameImage, 0, 0);
  }

  function setFastUi(on) {
    fast = !!on;
    const b = document.getElementById('bft');
    b.textContent = fast ? 'Fast ⏩' : 'Fast';
    b.style.background = fast ? '#c84' : '';
  }

  function ctrlLayout() {
    const w = cc.offsetWidth;
    if (!w) return;
    cc.width = w;
    cc.height = cc.offsetHeight || 130;
    const h = cc.height;
    CL.dpr = Math.min(w * 0.18, h * 0.50);
    CL.dpx = w * 0.19;
    CL.dpy = h * 0.5;
    CL.ar = Math.min(w * 0.075, h * 0.26);
    CL.ax = w * 0.85;
    CL.ay = h * 0.65;
    CL.bx = w * 0.74;
    CL.by = h * 0.3;
    CL.sw = Math.max(40, w * 0.11);
    CL.sh = Math.max(18, h * 0.22);
    CL.slx = w * 0.43;
    CL.sly = h * 0.5;
    CL.stx = w * 0.56;
    CL.sty = h * 0.5;
  }

  function bitsAt(x, y) {
    let b = 0;
    const dx = x - CL.dpx;
    const dy = y - CL.dpy;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > 8 && d < CL.dpr + 14) {
      const ax = Math.abs(dx);
      const ay = Math.abs(dy);
      if (dy < 0 && ay > ax * 0.5) b |= 4;
      if (dy > 0 && ay > ax * 0.5) b |= 8;
      if (dx < 0 && ax > ay * 0.5) b |= 2;
      if (dx > 0 && ax > ay * 0.5) b |= 1;
    }
    const r2 = CL.ar * CL.ar * 2;
    const adx = x - CL.ax;
    const ady = y - CL.ay;
    if (adx * adx + ady * ady < r2) b |= 16;
    const bdx = x - CL.bx;
    const bdy = y - CL.by;
    if (bdx * bdx + bdy * bdy < r2) b |= 32;
    if (Math.abs(x - CL.slx) < CL.sw / 2 && Math.abs(y - CL.sly) < CL.sh / 2) b |= 64;
    if (Math.abs(x - CL.stx) < CL.sw / 2 && Math.abs(y - CL.sty) < CL.sh / 2) b |= 128;
    return b;
  }

  function ctrlPt(t) {
    const r = cc.getBoundingClientRect();
    return {x:(t.clientX-r.left)*cc.width/r.width,y:(t.clientY-r.top)*cc.height/r.height};
  }

  function ctrlUpdate() {
    let b = 0;
    for (const id in cTouches) b |= cTouches[id];
    if (b !== cBtns) {
      cBtns = b;
      if (backend) backend.sendJoypad(b);
    }
    drawCtrl();
  }

  function drawCtrl() {
    if (!cc2 || !cc.width || !cc.height) return;
    const w = cc.width;
    const h = cc.height;
    const c = cc2;
    c.clearRect(0, 0, w, h);
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    [[2,0,-1,'▲'],[3,0,1,'▼'],[1,-1,0,'◄'],[0,1,0,'►']].forEach((d) => {
      const on = cBtns & (1 << d[0]);
      const ax = CL.dpx + d[1] * CL.dpr * 0.55;
      const ay = CL.dpy + d[2] * CL.dpr * 0.55;
      const aw = d[1] ? CL.dpr * 0.58 : CL.dpr * 0.48;
      const ah = d[2] ? CL.dpr * 0.58 : CL.dpr * 0.48;
      c.fillStyle = on ? '#3a3a70' : '#1a1a30';
      c.beginPath();
      c.roundRect(ax - aw / 2, ay - ah / 2, aw, ah, 4);
      c.fill();
      c.fillStyle = on ? '#ddd' : '#555';
      c.font = Math.round(CL.dpr * 0.32) + 'px monospace';
      c.fillText(d[3], ax, ay);
    });
    const cs = CL.dpr * 0.34;
    c.fillStyle = '#0a0a18';
    c.fillRect(CL.dpx - cs, CL.dpy - cs, cs * 2, cs * 2);
    [[CL.ax,CL.ay,4,'A','#9b2020'],[CL.bx,CL.by,5,'B','#6b2090']].forEach((b) => {
      const on = cBtns & (1 << b[2]);
      c.beginPath();
      c.arc(b[0], b[1], CL.ar, 0, Math.PI * 2);
      c.fillStyle = on ? '#5050bb' : b[4];
      c.fill();
      c.fillStyle = '#fff';
      c.font = 'bold ' + Math.round(CL.ar * 0.7) + 'px monospace';
      c.fillText(b[3], b[0], b[1]);
    });
    [[CL.slx,CL.sly,6,'SEL'],[CL.stx,CL.sty,7,'START']].forEach((b) => {
      const on = cBtns & (1 << b[2]);
      c.beginPath();
      c.roundRect(b[0] - CL.sw / 2, b[1] - CL.sh / 2, CL.sw, CL.sh, 5);
      c.fillStyle = on ? '#3a3a70' : '#1a1a30';
      c.fill();
      c.fillStyle = on ? '#bbb' : '#555';
      c.font = '9px monospace';
      c.fillText(b[3], b[0], b[1]);
    });
  }

  function resize() {
    const sw = document.getElementById('sw');
    const aw = sw.clientWidth || window.innerWidth;
    const ah = sw.clientHeight || Math.floor(window.innerHeight * 0.6);
    let s = Math.min(aw / 160, ah / 144);
    if (s < 1) s = 1;
    cv.style.width = Math.floor(160 * s) + 'px';
    cv.style.height = Math.floor(144 * s) + 'px';
    ctrlLayout();
    drawCtrl();
  }

  function setButtonState(bit, on) {
    const prev = btns;
    btns = on ? (btns | (1 << bit)) : (btns & ~(1 << bit));
    if (btns !== prev && backend) backend.sendJoypad(btns);
  }

  async function loadScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  async function ensureWasmFactory() {
    if (typeof window.createGameBoy === 'function') return true;
    const candidates = ['../dist/gb.js', './gb.js'];
    for (const src of candidates) {
      try {
        await loadScript(src);
        if (typeof window.createGameBoy === 'function') return true;
      } catch (_) {}
    }
    return false;
  }

  async function setupBackend() {
    const preferWasm = location.search.indexOf('wasm') !== -1 || typeof window.createGameBoy === 'function';
    if (preferWasm && await ensureWasmFactory()) {
      const mod = await window.createGameBoy();
      backend = new WasmBackend(mod);
      isWasm = true;
      brom.style.display = '';
      document.getElementById('transport-row').style.display = 'none';
      document.getElementById('wasm-saves').style.display = '';
      document.getElementById('wasm-sep').style.display = '';
      updateStatus('Load a ROM');
    } else {
      const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
      backend = new RemoteBackend(proto + location.host + '/ws');
      brom.style.display = 'none';
      document.getElementById('bslots').style.display = '';
      backend.onslotinfo = info => { slotData = info; renderSlots(); };
    }
    backend.onframe = renderFrame;
    backend.onstatus = updateStatus;
    applyPalette(paletteIdx);
    if (!isWasm) applyTransport(transportMode);
    resize();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('load', resize);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'F5') {
      e.preventDefault();
      if (!isWasm) doSaveSlot(activeSlot);
      else if (backend) backend.sendSave();
      return;
    }
    if (e.key === 'F8') {
      e.preventDefault();
      if (!isWasm) doLoadSlot(activeSlot);
      else if (backend) backend.sendLoad();
      return;
    }
    if (e.key === 'f' || e.key === 'F') {
      if (backend) backend.setFast(!fast);
      setFastUi(!fast);
      e.preventDefault();
      return;
    }
    const b = km[e.key];
    if (b !== undefined) {
      setButtonState(b, true);
      e.preventDefault();
    }
  });

  document.addEventListener('keyup', (e) => {
    const b = km[e.key];
    if (b !== undefined) {
      setButtonState(b, false);
      e.preventDefault();
    }
  });

  document.getElementById('brs').onclick = () => { if (backend) backend.sendReset(); };
  document.getElementById('bft').onclick = () => {
    if (backend) backend.setFast(!fast);
    setFastUi(!fast);
  };
  document.getElementById('bsv').onclick = () => { if (backend) backend.sendSave(); };
  document.getElementById('bld').onclick = () => { if (backend) backend.sendLoad(); };
  brom.onclick = () => {
    if (!isWasm || !backend || typeof backend.loadRom !== 'function') return;
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.gb,.gbc';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      file.arrayBuffer().then((buf) => backend.loadRom(new Uint8Array(buf)));
    };
    input.click();
  };

  ['touchstart','touchmove'].forEach((ev) => {
    cc.addEventListener(ev, (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const p = ctrlPt(t);
        cTouches[t.identifier] = bitsAt(p.x, p.y);
      }
      ctrlUpdate();
    }, {passive:false});
  });

  ['touchend','touchcancel'].forEach((ev) => {
    cc.addEventListener(ev, (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) delete cTouches[e.changedTouches[i].identifier];
      ctrlUpdate();
    }, {passive:false});
  });

  setFastUi(false);
  resize();
  setupBackend().catch((err) => {
    console.error(err);
    updateStatus('Backend init failed');
  });
})();
</script>
</body>
</html>
